spring.application.name=coldtrace-alert-service
server.port=${PORT:8084}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ct_alert?serverTimezone=UTC}
spring.datasource.username=${DB_USER:ct_alert}
spring.datasource.password=${DB_PASSWORD:}
spring.flyway.enabled=true
coldtrace.identity.url=${IDENTITY_URL:http://localhost:8081}
# Only local emulator pushes are supported in this increment. Cloud OIDC is not implemented.
coldtrace.pubsub.local-push-enabled=false
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
coldtrace.internal.service-key=${INTERNAL_SERVICE_KEY:}

coldtrace.ai.url=${AI_URL:http://localhost:8087}
coldtrace.asset.url=${ASSET_URL:http://localhost:8082}
coldtrace.subscription.url=${SUBSCRIPTION_URL:http://localhost:8088}
coldtrace.monitoring.url=${MONITORING_URL:http://localhost:8083}
coldtrace.maintenance.url=${MAINTENANCE_URL:http://localhost:8086}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=com.acme.coldtrace.platform.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy
