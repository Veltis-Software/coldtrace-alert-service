spring.application.name=coldtrace-alert-service
server.port=${PORT:8084}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ct_alert?serverTimezone=UTC}
spring.datasource.username=${DB_USER:ct_alert}
spring.datasource.password=${DB_PASSWORD:}
spring.flyway.enabled=true
coldtrace.identity.url=${IDENTITY_URL:http://127.0.0.1:8090}
# Only local emulator pushes are supported in this increment. Cloud OIDC is not implemented.
coldtrace.pubsub.local-push-enabled=false
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
