name: Verify independent service
on: [push, pull_request, workflow_dispatch]
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {path: service}
      - uses: actions/checkout@v4
        with:
          repository: Veltis-Software/coldtrace-infrastructure
          ref: 322854fb29afea699d6854cba4c9f836e2c8db62
          path: infrastructure
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven, cache-dependency-path: '**/pom.xml'}
      - run: mvn -B -f infrastructure/libraries/coldtrace-shared/pom.xml install
      - run: mvn -B -f service/pom.xml verify
      - run: docker build --build-context shared=./infrastructure/libraries/coldtrace-shared -t coldtrace-alert-service:ci ./service
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: test-results, path: service/target/surefire-reports}
